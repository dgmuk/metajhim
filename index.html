    :root {

      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; max-width: 1240px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    h1 { font-size: 1.45rem; font-weight: 700; color: var(--text); }
    .subtitle { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
    .card-value { font-size: 1.50rem; font-weight: 700; color: var(--accent); }
    .card-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .controls-bar { display: flex; flex-wrap: wrap; gap: 16px; background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; align-items: flex-end; }
    .control-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 190px; }
    label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }

    select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .btn { background: var(--accent); color: #0f172a; font-weight: 700; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 0.88rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #052e16; }
    .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
    .badge-info { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .badge-warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .workout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .day-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .day-header { border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .day-title { font-weight: 700; color: var(--accent); }
    .ex-item { background: var(--card-alt); border-radius: 8px; padding: 12px; font-size: 0.88rem; }
    .ex-name { font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .ex-plan { color: var(--warning); font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; }
    .progress-bar-wrap { background: var(--bg); border-radius: 999px; height: 10px; width: 100%; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; transition: width 0.3s ease; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; background: var(--card-alt); }
    tr.active-row { background: rgba(56, 189, 248, 0.12); }
    .supp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
    .supp-item { background: var(--card-alt); padding: 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: #052e16; padding: 12px 20px; border-radius: 8px; font-weight: 700; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 100; }

      if(chartSeries.fact)a+=`<g data-series="fact">${plot(fact,y,'#c4dc83','Мой результат',{actual:true})}</g>`;
      $('repsChart').innerHTML=a+chartInteractions('reps')+'</svg>';
      $('repsChartHelp').textContent=(recorded.length===0?'Добавьте подход на 100 кг в дневник — здесь появится ваш результат.':recorded.length===1?'Пока записана одна неделя — ваш результат показан крупной точкой. По мере записей появится линия.':'Ваши результаты обновляются из дневника. Пустые недели остаются без точек.')+' Нажмите на неделю, чтобы увидеть значения. Кнопки легенды скрывают и показывают линии.';
      const isWeight=healthMode==='weight',values=Array.from({length:16},(_,i)=>num(state.weeks[i+1]?.[isWeight?'weight':'shoulderLeft'])),numbers=values.filter(v=>v!==null),latestIndex=values.findLastIndex(v=>v!==null),latest=latestIndex<0?null:values[latestIndex];
      $('healthLatestValue').innerHTML=latest===null?'—':isWeight?`${latest.toFixed(1)} <small>кг</small>`:`${latest} <small>/ 10</small>`;
      $('healthLatestCaption').textContent=latest===null?'Пока нет записей':`последняя запись · неделя ${latestIndex+1}`;
      $('healthSummary').innerHTML=isWeight?'Цель к старту: <strong>97.5–98.0 кг</strong>':'<strong>0</strong> — без дискомфорта · <strong>10</strong> — максимальный';
      for(const [id,selected] of [['healthWeightTab',isWeight],['healthShoulderTab',!isWeight]]){$(id).setAttribute('aria-selected',String(selected));$(id).tabIndex=selected?0:-1;}
      $('healthChart').setAttribute('aria-labelledby',isWeight?'healthWeightTab':'healthShoulderTab');
      $('healthLegend').innerHTML=`<span class="legend-label"><span class="legend-swatch dot" style="--line:${isWeight?'#c4dc83':'#da9c90'}" aria-hidden="true"></span>${isWeight?'Мой вес':'Левое плечо'}</span>${isWeight?'<span class="legend-label"><span class="legend-swatch dashed" style="--line:#a5bb76" aria-hidden="true"></span>Целевой вес</span>':''}`;
      const lo=isWeight?Math.floor(Math.min(97.5,...numbers)-1):0,hi=isWeight?Math.ceil(Math.max(100,...numbers)+1):10,hy=v=>226-(v-lo)/(hi-lo)*200;
      let b=chartBase(isWeight?'Вес тела по неделям в килограммах':'Дискомфорт левого плеча по неделям от 0 до 10',Array.from({length:6},(_,i)=>[(lo+(hi-lo)*i/5).toFixed(isWeight?1:0),226-i*40]),isWeight?'Килограммы':'Дискомфорт, 0–10');
      if(isWeight)b+=`<rect x="48" y="${hy(98)}" width="492" height="${hy(97.5)-hy(98)}" fill="#c4dc83" fill-opacity=".12"/><line x1="48" x2="540" y1="${hy(98)}" y2="${hy(98)}" stroke="#a5bb76" stroke-dasharray="4 4"/>`;
      b+=plot(values,hy,isWeight?'#c4dc83':'#da9c90',isWeight?'Мой вес':'Левое плечо',{actual:true});$('healthChart').innerHTML=b+chartInteractions('health')+'</svg>';
      $('healthChartHelp').textContent=isWeight?'Вес берётся из поля «Утренний вес» выбранной недели. Светлая полоса — ваш целевой диапазон.':'Оценка берётся из поля «Левое плечо» выбранной недели. Она помогает видеть, как меняется дискомфорт от недели к неделе.';
      const lastFact=fact.findLastIndex(v=>v!==null)+1;inspectChart('reps',repsInspectWeek??(lastFact||state.activeWeek));inspectChart('health',healthInspectWeek??(latestIndex<0?state.activeWeek:latestIndex+1));
    }
    function getBio(){return {baseline:clone(BASELINE_BIO),ferritin:has(state.ferritin)?state.ferritin:null,iron:has(state.iron)?state.iron:null,units:{ferritin:'нг/мл',iron:'мкмоль/л'}};}
    function weeklyPayload(){
      const w=state.activeWeek,start=addDays(state.cycleStart,(w-1)*7),end=addDays(start,6),checks={};
      for(const [key,value] of Object.entries(state.suppChecks))if(key.slice(0,10)>=start&&key.slice(0,10)<=end)checks[key]=value;
      const plan=getWeekPlan(w),fact=clone(state.weeks[w]||{}),best=workoutBest(fact);
      return {schema:'metajhim.weekly-report.v1',athlete:'Дмитрий Мухин',week:w,weekStart:start,weekEnd:end,phase:plan.phase,targetRepsKMS:state.targetReps,compDate:state.compDate,plan:{...clone(plan),days:trainingDays(plan)},fact:{...fact,...best},biochemistry:getBio(),recordedBiochemistry:state.weeks[w]?.biochemistry||null,pct:{lastInjectDate:LAST_INJECT,startDate:PCT_START,endDate:PCT_END,userProvidedSchedule:true,today:pctForDate(todayDate())},suppChecks:checks,protectedThrough:protectedThrough()};
    }
    function reportText(){
      const p=weeklyPayload(),d=p.fact;
      return [`Дмитрий Мухин · неделя ${p.week} (${dateLabel(p.weekStart)}–${dateLabel(p.weekEnd)})`,`${p.phase}\n100 кг: план ${p.plan.target100} / факт ${show(d.reps100)} повт.; RIR ${show(d.rir)}`,`Утренний вес ${show(d.weight,' кг')} · левое плечо ${show(d.shoulderLeft,'/10')} · правое ${show(d.shoulderRight,'/10')}`,
        ...[1,2,3].flatMap(n=>[`День ${n} · план: ${p.plan.days['d'+n].map(e=>e.name+': '+e.prescription).join(' | ')}`,`День ${n} · факт:\n${dayReport(d,n)}`]),
        `Биохимия: ферритин ${show(state.ferritin,' нг/мл')}, железо ${show(state.iron,' мкмоль/л')}. Исходные показатели 18.10.2026 включены в JSON.`,
        `ПКТ: последний укол 18.10.2026, пользовательский график 08.11–05.12.2026. Отметок приёма за неделю: ${Object.values(p.suppChecks).filter(Boolean).length}.`,
        `Заметки: ${show(d.notes)}`,'--- JSON для тренера ---',JSON.stringify(p)].join('\n');
    }
    async function copyWeeklyReport(){const text=reportText();try{await navigator.clipboard.writeText(text);showToast('Сводка и компактный JSON скопированы.');}catch{$('reportArea').value=text;$('reportModal').showModal();$('reportArea').focus();$('reportArea').select();}}
    function dayReport(d,n){const day=d.workouts?.['d'+n],lines=[];if(day)for(const e of day.exercises){const sets=e.sets.map((s,i)=>`${i+1}) ${show(s.weight,' кг')} × ${show(s.reps,e.unit==='seconds'?' с':' повт.')} · RIR ${show(s.rir)}`).join('; ');lines.push(e.name+': '+sets+(e.comment?'\nКомментарий: '+e.comment:''));}if(has(d['d'+n+'_fact']))lines.push('Прежняя запись: '+d['d'+n+'_fact']);return lines.length?lines.join('\n'):'—';}
    function showToast(message){clearTimeout(toastTimer);$('toastBox').textContent=message;$('toastBox').style.display='block';toastTimer=setTimeout(()=>$('toastBox').style.display='none',4000);}
    function openImportModal(){invalidatePatch();$('importModal').showModal();$('importJsonArea').focus();}
    function closeImportModal(){$('importModal').close();}
    function invalidatePatch(){pendingPatch=null;$('applyPatchButton').disabled=true;$('patchPreview').className='notice';$('patchPreview').textContent=`Патч меняет только недели после ${protectedThrough()}-й и настройки цели / даты старта. Сначала проверьте JSON.`;}
    function readImport(){const text=$('importJsonArea').value.trim();if(!text)throw Error('Вставьте JSON.');if(text.length>500000)throw Error('Максимальный размер — 500 КБ.');let p;try{p=JSON.parse(text);}catch{throw Error('Некорректный JSON: проверьте запятые, скобки и кавычки.');}if(!obj(p))throw Error('Ожидается JSON-объект.');return p;}
    function preparePatch(parsed){
      const allowed=['schema','version','targetReps','compDate','plan','customPlan','settings','weeks','activeWeek','ferritin','iron','lastInjectDate','suppChecks','cycleStart','exportedAt'];
      for(const k of Object.keys(parsed))if(!allowed.includes(k))throw Error('Неизвестное поле: '+k);
      if(parsed.schema&&!['metajhim.coach-patch.v1','metajhim.backup.v2'].includes(parsed.schema))throw Error('Нужен патч тренера или JSON-архив; отчёт недели не является патчем.');
      if(own(parsed,'plan')&&own(parsed,'customPlan'))throw Error('Укажите только plan или customPlan.');
      const settings=parsed.settings??{};if(!obj(settings))throw Error('settings должен быть объектом.');for(const k of Object.keys(settings))if(!['targetReps','compDate'].includes(k))throw Error('Настройка не поддерживается: '+k);
      const next=clone(state),changes=[],skipped=[],boundary=protectedThrough(),merged={};
      for(const k of ['targetReps','compDate']){if(own(parsed,k))merged[k]=parsed[k];if(own(settings,k))merged[k]=settings[k];}
      if(own(merged,'targetReps')){if(![24,26,27,29].includes(merged.targetReps))throw Error('targetReps: 24, 26, 27 или 29.');if(merged.targetReps!==state.targetReps){changes.push(`Цель: ${state.targetReps} → ${merged.targetReps}`);next.targetReps=merged.targetReps;}}
      if(own(merged,'compDate')){if(merged.compDate!==''&&!validDate(merged.compDate))throw Error('compDate: существующая дата YYYY-MM-DD или пустая строка.');if(merged.compDate!==state.compDate){changes.push(`Дата соревнований: ${show(state.compDate)} → ${show(merged.compDate)}`);next.compDate=merged.compDate;}}
      const entries=own(parsed,'plan')?parsed.plan:parsed.customPlan;
      if(entries!==undefined&&entries!==null){
        if(!Array.isArray(entries)||!entries.length||entries.length>16)throw Error('plan / customPlan: массив из 1–16 недель.');
        const seen=new Set();for(const p of entries){validatePlan(p,true);if(seen.has(p.w))throw Error(`Неделя ${p.w} повторяется.`);seen.add(p.w);}
        const plan=clone(getActivePlan());let planChanged=false;
        for(const p of entries){if(p.w<=boundary){skipped.push(p.w);continue;}const i=plan.findIndex(x=>x.w===p.w),old=plan[i],keys=PLAN_KEYS.filter(k=>own(p,k)&&p[k]!==old[k]);if(keys.length){plan[i]={...old,...p};planChanged=true;for(const k of keys)changes.push(`Неделя ${p.w} · ${k}: ${old[k]} → ${p[k]}`);}}
        if(planChanged)next.customPlan=plan;
      }
      return {next,changes,skipped,boundary,ignored:['weeks','suppChecks','lastInjectDate','cycleStart','activeWeek','ferritin','iron'].filter(k=>own(parsed,k))};
    }
    function previewPatch(){
      pendingPatch=null;$('applyPatchButton').disabled=true;
      try{const p=preparePatch(readImport());pendingPatch=p;$('patchPreview').className='notice';$('patchPreview').textContent=[`Защищены недели 1–${p.boundary}: текущая по календарю и все до последней с фактом.`,p.skipped.length?`Пропущены недели: ${p.skipped.join(', ')}.`:'',p.ignored.length?`Сохраняются без изменений: ${p.ignored.join(', ')}.`:'',p.changes.length?p.changes.join('\n\n'):'Нет применимых изменений.'].filter(Boolean).join('\n\n');$('applyPatchButton').disabled=!p.changes.length;}
      catch(e){$('patchPreview').className='notice error';$('patchPreview').textContent=e.message;}
    }
    function applyImportedJson(){
      if(!pendingPatch)return;
      try{const p=preparePatch(readImport());if(!p.changes.length)throw Error('Нет изменений. Проверьте патч заново.');if(JSON.stringify(p.changes)!==JSON.stringify(pendingPatch.changes)){previewPatch();throw Error('Предпросмотр обновился. Проверьте его перед применением.');}if(!saveToStorage(p.next))throw Error('Патч не применён: недоступно сохранение.');state=p.next;closeImportModal();fillSettings();renderAll();renderSupplements();updatePctCountdown();showToast('Патч применён. История и отметки добавок сохранены.');}
      catch(e){$('patchPreview').className='notice error';$('patchPreview').textContent=e.message;}
    }
    function downloadJSON(payload,name){const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function exportJSON(){
      if(storageProblem){try{downloadJSON({unreadableOriginal:localStorage.getItem(STORAGE_KEY)??localStorage.getItem('metajhim_dmitry_v4')},'metajhim_unreadable_original.json');return;}catch{}}
      downloadJSON({...clone(state),customPlan:getActivePlan().map(p=>({...clone(p),days:trainingDays(p)})),schema:'metajhim.backup.v2',exportedAt:new Date().toISOString()},`metajhim_week_${state.activeWeek}.json`);
    }
    function restoreBackup(){
      try{const p=readImport();if(p.schema!=='metajhim.backup.v2'&&!(p.version&&obj(p.weeks)))throw Error('Вставьте JSON-архив MetaJhim.');const restored=normalizeState(p);delete restored.schema;delete restored.exportedAt;
        if(!confirm('Заменить весь дневник и отметки добавок данными архива? Сначала скачайте текущий архив.'))return;
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));}catch(e){throw Error('Не удалось восстановить архив: '+e.message);}state=restored;storageProblem='';$('storageWarning').hidden=true;closeImportModal();fillSettings();renderAll();renderSupplements();updatePctCountdown();showToast('Дневник и трекер восстановлены из архива.');
      }catch(e){$('patchPreview').className='notice error';$('patchPreview').textContent=e.message;}
    }
    let installPrompt=null;
    const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    function initPwa(){
      const button=$('installAppButton');button.hidden=isStandalone();
      window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.hidden=isStandalone();});
      window.addEventListener('appinstalled',()=>{installPrompt=null;button.hidden=true;showToast('Приложение установлено. Открывайте его с главного экрана.');});
      const connection=()=>{$('pwaOfflineStatus').hidden=navigator.onLine;};connection();window.addEventListener('online',connection);window.addEventListener('offline',connection);
      const standaloneMedia=window.matchMedia('(display-mode: standalone)');standaloneMedia.addEventListener('change',()=>{button.hidden=isStandalone();});
      if('serviceWorker' in navigator&&window.isSecureContext&&['http:','https:'].includes(location.protocol)){
        navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(error=>console.warn('Offline support unavailable:',error.message));
      }
    }
    async function installPwa(){
      if(isStandalone())return;
      if(installPrompt){const prompt=installPrompt;installPrompt=null;try{await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')$('installAppButton').hidden=true;}catch{showInstallHelp();}}
      else showInstallHelp();
    }
    function showInstallHelp(){
      const apple=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      $('pwaInstallHelp').textContent=apple?'На iPhone откройте сайт в Safari. Нажмите «Поделиться» → «На экран Домой». Если доступен переключатель «Открывать как веб-приложение», включите его, затем нажмите «Добавить».':'На Android откройте сайт в Chrome. В меню ⋮ выберите «Установить приложение» или «Добавить на главный экран» → «Установить». Если уже добавлен обычный ярлык, сначала установите приложение, затем уберите старый ярлык.';
      $('pwaInstallDialog').showModal();
    }
    initApp();
  </script>
